services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: datalens
      POSTGRES_PASSWORD: datalens_dev_only
      POSTGRES_DB: datalens
    ports:
      - "5432:5432"
    volumes:
      - datalens_pgdata:/var/lib/postgresql/data
      - ./backend/data/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datalens -d datalens"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # .env is written for host-based local dev, where Postgres is reached
      # via localhost:5432 (the port mapping below exposes it that way).
      # Inside the Docker network, "localhost" would resolve to the backend
      # container itself, not the db service - these two overrides (which
      # take precedence over the same keys in env_file) are what actually
      # let the container reach Postgres by its service name instead.
      DATABASE_URL: postgresql://datalens:datalens_dev_only@db:5432/datalens
      DATABASE_URL_READONLY: postgresql://datalens_readonly:datalens_readonly_dev_only@db:5432/datalens
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  datalens_pgdata:
